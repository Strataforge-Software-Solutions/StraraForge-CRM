<p>A password reset was requested for your StrataForge CRM account.</p>
{{ if .RedirectTo }}
<p><a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery">Reset your password</a></p>
{{ else }}
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/set-password">Reset your password</a></p>
{{ end }}
<p>If you did not request this, you can ignore this email. Your CRM still requires an authenticator code.</p>
